# Sized for the 14 GB build machine. The previous -Xmx6g with
# -XX:MaxMetaspaceSize=4G asked for 10 GB before the Kotlin daemon and R8 had
# started, and the release build died with an OutOfMemoryError: Metaspace once
# resource shrinking was turned on. 4 GB of heap is comfortable for this
# project and 1 GB of metaspace is far more than Gradle and AGP need.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# The Kotlin compile daemon is a second JVM; left unbounded it competes with
# the Gradle daemon for the same memory.
kotlin.daemon.jvmargs=-Xmx2g
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
